name: CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
          python -m pip check
      - name: Fetch pinned scoring resource
        run: python third_party/cmrc2018/fetch_punkt.py
      - name: Run CPU suite (six real-data checks skip on a fresh clone)
        run: python -m unittest discover -s tests -v
